<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>{{TITLE}} · autoemail</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --bg: #eef1f4; --surface: #ffffff; --surface-2: #f5f7f9; --ink: #10151a; --muted: #5b6772;
        --line: #d9dfe5; --signal: #0f7c80; --signal-ink: #ffffff; --bad: #c1453b;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #0f1418; --surface: #161d22; --surface-2: #1c252b; --ink: #e6ecf0; --muted: #94a3ae;
          --line: #2a353d; --signal: #2fb3b8; --signal-ink: #08201f; --bad: #e2675c;
        }
      }
      * { box-sizing: border-box; }
      body {
        margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 16px;
        background: var(--bg); color: var(--ink); font: 15px/1.45 'IBM Plex Sans', system-ui, sans-serif;
      }
      .card {
        width: 100%; max-width: 380px; background: var(--surface); border: 1px solid var(--line);
        border-radius: 12px; padding: 28px 26px 24px; box-shadow: 0 10px 30px rgba(16, 21, 26, 0.08);
      }
      .brand { display: flex; align-items: center; gap: 10px; margin-bottom: 22px; }
      .mark { width: 14px; height: 14px; border-radius: 4px; background: var(--signal); }
      .wordmark { font-weight: 700; font-size: 17px; letter-spacing: -0.01em; }
      .tag { color: var(--muted); font-size: 13px; }
      h1 { font-size: 20px; margin: 0 0 4px; }
      p.sub { margin: 0 0 20px; color: var(--muted); font-size: 14px; }
      label { display: block; font-size: 13px; font-weight: 600; margin-bottom: 6px; }
      input {
        width: 100%; padding: 10px 12px; border: 1px solid var(--line); border-radius: 8px;
        background: var(--surface-2); color: var(--ink); font: 500 15px 'IBM Plex Mono', monospace;
      }
      input:focus { outline: 2px solid var(--signal); outline-offset: 1px; border-color: var(--signal); }
      button {
        width: 100%; margin-top: 16px; padding: 11px; border: 0; border-radius: 8px; cursor: pointer;
        background: var(--signal); color: var(--signal-ink); font: 600 15px 'IBM Plex Sans', sans-serif;
      }
      button[disabled] { opacity: 0.6; cursor: default; }
      .err { min-height: 20px; margin-top: 12px; color: var(--bad); font-size: 14px; }
      .alt { margin-top: 18px; font-size: 13px; color: var(--muted); text-align: center; }
      .alt a { color: var(--signal); }
    </style>
  </head>
  <body>
    <form class="card" id="f" autocomplete="on">
      <div class="brand"><span class="mark" aria-hidden="true"></span><span class="wordmark">autoemail</span><span class="tag">{{TAG}}</span></div>
      <h1>{{HEADING}}</h1>
      <p class="sub">{{SUB}}</p>
      <label for="pw">Password</label>
      <input id="pw" name="password" type="password" autocomplete="current-password" required autofocus />
      <button type="submit" id="go">Sign in</button>
      <div class="err" id="err" role="alert"></div>
      <div class="alt">{{ALT}}</div>
    </form>
    <script>
      (function () {
        var f = document.getElementById('f');
        var err = document.getElementById('err');
        var go = document.getElementById('go');
        var next = new URLSearchParams(location.search).get('next') || '{{DEFAULT_NEXT}}';
        f.addEventListener('submit', function (e) {
          e.preventDefault();
          err.textContent = '';
          go.disabled = true;
          fetch(location.pathname, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ password: document.getElementById('pw').value, next: next }),
          })
            .then(function (r) { return r.json().then(function (d) { return { ok: r.ok, d: d }; }); })
            .then(function (x) {
              if (x.ok && x.d.ok) location.replace(x.d.next || '/');
              else {
                err.textContent = (x.d && x.d.error) || 'Could not sign in.';
                go.disabled = false;
                document.getElementById('pw').select();
              }
            })
            .catch(function () {
              err.textContent = 'Server not reachable.';
              go.disabled = false;
            });
        });
      })();
    </script>
  </body>
</html>
