<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>{{TITLE}} · autoemail</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible+Mono:wght@400;500&family=Host+Grotesk:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/tokens.css" />
    <link rel="stylesheet" href="/base.css" />
    <style>
      /* Hallmark · Console tokens from /tokens.css · login card */
      body { min-height: 100dvh; display: grid; place-items: center; padding: var(--space-md); font-size: var(--text-sm); }
      .card { width: 100%; max-width: 360px; background: var(--color-paper-2); border: var(--rule-hair) solid var(--color-rule); border-radius: var(--radius-card); padding: var(--space-lg); }
      .brand { display: flex; align-items: center; gap: var(--space-sm); margin-bottom: var(--space-lg); }
      .mark-link { display: inline-flex; flex: none; border-radius: 9px; }
      .mark-link:focus-visible { outline: 2px solid var(--color-focus); outline-offset: 4px; }
      .mark { width: 36px; height: 36px; border-radius: 9px; }
      .tag { color: var(--color-muted); font-size: var(--text-xs); }
      h1 { font-size: var(--text-xl); margin: 0 0 var(--space-2xs); }
      p.sub { margin: 0 0 var(--space-lg); color: var(--color-muted); }
      label { display: block; font-size: var(--text-xs); font-weight: 500; color: var(--color-muted); margin-bottom: var(--space-2xs); }
      input { width: 100%; min-height: 40px; padding: 0 var(--space-sm); border: var(--rule-hair) solid var(--color-field-edge); border-radius: var(--radius-pill); background: var(--color-paper-3); color: var(--color-ink); font: 400 var(--text-md) var(--font-outlier); outline: 2px solid transparent; outline-offset: -2px; }
      input:focus-visible { outline-color: var(--color-focus); }
      button { width: 100%; min-height: 40px; margin-top: var(--space-md); border: var(--rule-hair) solid var(--color-accent); border-radius: var(--radius-pill); cursor: pointer; background: var(--color-accent); color: var(--color-accent-ink); font: 500 var(--text-sm) var(--font-body); transition: background-color var(--dur-short) var(--ease-out), transform var(--dur-micro) var(--ease-out); }
      button:hover { background: color-mix(in oklab, var(--color-accent) 88%, var(--color-ink)); }
      button:active { transform: translateY(1px); }
      button:focus-visible { outline: 2px solid var(--color-focus); outline-offset: 2px; }
      button[disabled] { opacity: 0.55; cursor: not-allowed; transform: none; }
      .err { min-height: 1lh; margin-top: var(--space-sm); color: var(--color-bad); }
      .alt { margin-top: var(--space-md); font-size: var(--text-xs); color: var(--color-muted); text-align: center; }
      .alt a { color: var(--color-ink-2); }
      .alt a:hover { color: var(--color-accent); }
    </style>
  </head>
  <body>
    <form class="card" id="f" autocomplete="on">
      <div class="brand"><a class="mark-link" href="/" aria-label="autoemail, home"><img class="mark" src="/favicon.svg" width="36" height="36" alt="" /></a><span class="tag">{{TAG}}</span></div>
      <h1>{{HEADING}}</h1>
      <p class="sub">{{SUB}}</p>
      <label for="pw">Password</label>
      <input id="pw" name="password" type="password" autocomplete="current-password" required autofocus />
      <button type="submit" id="go">Sign in</button>
      <div class="err" id="err" role="alert"></div>
      <div class="alt">{{ALT}}</div>
    </form>
    <script>
      (function () {
        var f = document.getElementById('f');
        var err = document.getElementById('err');
        var go = document.getElementById('go');
        var next = new URLSearchParams(location.search).get('next') || '{{DEFAULT_NEXT}}';
        f.addEventListener('submit', function (e) {
          e.preventDefault();
          err.textContent = '';
          go.disabled = true;
          fetch(location.pathname, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ password: document.getElementById('pw').value, next: next }),
          })
            .then(function (r) { return r.json().then(function (d) { return { ok: r.ok, d: d }; }); })
            .then(function (x) {
              if (x.ok && x.d.ok) location.replace(x.d.next || '/');
              else {
                err.textContent = (x.d && x.d.error) || 'Could not sign in.';
                go.disabled = false;
                document.getElementById('pw').select();
              }
            })
            .catch(function () {
              err.textContent = 'Server not reachable.';
              go.disabled = false;
            });
        });
      })();
    </script>
  </body>
</html>
